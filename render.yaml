services:
  - type: web
    name: hkd-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: FRONTEND_URL
        value: https://hkd-tai-chinh.netlify.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: DATABASE_URL
        fromDatabase:
          name: hkd-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
